# Ocean Theme
# Cool sea tones — hues spread wide so every state is distinct
# even after the badge brightens them.

COLOR_BASH="#4d3a01"     # Sandy gold    — shell commands
COLOR_CODE="#012a66"     # Deep blue     — writing code
COLOR_READ="#1a1466"     # Indigo        — reading/searching files
COLOR_AGENT="#01564d"    # Turquoise     — subagent working
COLOR_INPUT="#5c1030"    # Raspberry     — needs your input
COLOR_IDLE="#16324a"     # Steel blue    — thinking
COLOR_DONE="#0a4d28"     # Emerald       — done, your turn
COLOR_TOOL="#2a3a4a"     # Slate         — other tools
COLOR_WEB="#013a5c"      # Azure         — web search/fetch
COLOR_MCP="#3a1466"      # Violet        — MCP tools
